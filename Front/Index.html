<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSInvestment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <!-- Header -->
    <header>

        <nav>
            <ul>
                <li><a href="Index.html">Inicio</a></li>
                <li><a href="">Iniciar Sesion</a></li>
                <li><a href="">Registrarse</a></li>
            </ul>
        </nav>

    </header>

    <!-- Tabla principal -->
    <main>

        <table id="mainTbl">
            <thead>
                <tr>
                    <th>Accion</th>
                    <th>Precio</th>
                    <th>RSI</th>
                    <th>Variacion</th>
                    <th><button id="resetBtn">Reset</button></th>
                </tr>
            </thead>
            <tbody id="mainTblBody">
            </tbody>
        </table>


    </main>

    <aside>
    <!-- Botones de agregar -->
        <div>
            <button id="addBtn">Agregar</button>
        </div>

        <div>
            <button id="addGroupBtn">Agregar en grupo</button>
        </div>

    <!-- Acciones mas usadas que se agregan al clickear -->
        <div>
            <table id="mostUsed">
                <thead>
                    <tr>
                        <th>Accion</th>
                    </tr>
                </thead>
                <tbody id="mostUsedBody">
                </tbody>
            </table>
        </div>
    </aside>

    <footer>
    </footer>

    <script src="display.js"></script>

</body>
</html>
